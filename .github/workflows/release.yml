name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python: python
            archive: zip
          - os: ubuntu-latest
            platform: linux
            python: python3
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          ${{ matrix.python }} -m pip install --upgrade pip
          ${{ matrix.python }} -m pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: ${{ matrix.python }} -m pytest -q

      - name: Build application bundle
        shell: bash
        run: ${{ matrix.python }} -m PyInstaller --noconfirm --clean transcriber.spec

      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Transcriber -DestinationPath Transcriber-${{ github.ref_name }}-windows-x64.zip

      - name: Package Linux bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: tar -czf "Transcriber-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C dist Transcriber

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcriber-${{ github.ref_name }}-${{ matrix.platform }}-x64
          path: Transcriber-${{ github.ref_name }}-${{ matrix.platform }}-x64.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Transcriber-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Transcriber ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
